<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad2)"/>
  
  <!-- Ambient glow -->
  <circle cx="200" cy="150" r="90" fill="#f97316" opacity="0.12" filter="url(#orangeGlow)"/>

  <!-- Wristband Strap Body (Isometric Curve) -->
  <path d="M 140 60 C 260 50, 310 110, 270 200 C 240 260, 150 250, 120 180 C 100 130, 110 80, 140 60 Z" fill="none" stroke="url(#strapGrad)" stroke-width="36" stroke-linejoin="round"/>
  
  <!-- Haptic Sensor Core Box -->
  <rect x="145" y="105" width="110" height="75" rx="14" fill="#090d16" stroke="#f97316" stroke-width="2.5" filter="url(#orangeGlow)"/>
  
  <!-- Screen Elements -->
  <rect x="155" y="115" width="90" height="55" rx="8" fill="#020617"/>
  
  <!-- Haptic Wave lines -->
  <path d="M 165 142 Q 175 125, 185 142 T 205 142 T 225 142 T 235 142" fill="none" stroke="url(#neonOrange)" stroke-width="3" filter="url(#orangeGlow)"/>
  
  <!-- Feedback pulse dots -->
  <circle cx="170" cy="126" r="3" fill="#ef4444" filter="url(#orangeGlow)"/>
  <circle cx="200" cy="126" r="3" fill="#f97316" filter="url(#orangeGlow)"/>
  <circle cx="230" cy="126" r="3" fill="#22c55e" filter="url(#orangeGlow)"/>
  
  <text x="200" y="162" font-family="sans-serif" font-size="9" font-weight="bold" fill="#f97316" text-anchor="middle" letter-spacing="1">HAPTIC: 4.8G ACT</text>

  <!-- Side Directional Vibration Arrows -->
  <path d="M 125 130 L 115 140 L 125 150" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round" filter="url(#orangeGlow)"/>
  <path d="M 275 130 L 285 140 L 275 150" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round" filter="url(#orangeGlow)"/>

  <text x="200" y="270" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="3">PULSETOUCH PRO • HAPTIC GAMING</text>
</svg>