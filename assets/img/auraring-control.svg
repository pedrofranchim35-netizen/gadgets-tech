<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ringTitanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="30%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="auraGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="purpleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad3)"/>
  
  <!-- Outer gesture motion waves -->
  <ellipse cx="200" cy="145" rx="120" ry="70" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" filter="url(#purpleGlow)"/>
  <ellipse cx="200" cy="145" rx="150" ry="90" fill="none" stroke="#ec4899" stroke-width="1" stroke-dasharray="4 8" opacity="0.3"/>

  <!-- Ring Outer Circle (Perspective Ellipse) -->
  <ellipse cx="200" cy="145" rx="90" ry="55" fill="none" stroke="url(#ringTitanium)" stroke-width="26"/>
  
  <!-- Ring Inner Void -->
  <ellipse cx="200" cy="145" rx="77" ry="42" fill="#0b1120"/>

  <!-- Glowing Gesture Sensor Inlay -->
  <path d="M 120 145 C 130 185, 270 185, 280 145" fill="none" stroke="url(#auraGlowGrad)" stroke-width="6" stroke-linecap="round" filter="url(#purpleGlow)"/>
  
  <!-- Sensor Matrix Nodes -->
  <circle cx="160" cy="165" r="4" fill="#00f2fe" filter="url(#purpleGlow)"/>
  <circle cx="200" cy="172" r="5" fill="#f43f5e" filter="url(#purpleGlow)"/>
  <circle cx="240" cy="165" r="4" fill="#a855f7" filter="url(#purpleGlow)"/>

  <!-- Hand gesture trace lines -->
  <path d="M 185 105 L 200 90 L 215 105" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#purpleGlow)"/>
  <path d="M 185 85 L 200 70 L 215 85" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <text x="200" y="270" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="3">AURARING CONTROL • 3D SPATIAL GESTURE</text>
</svg>