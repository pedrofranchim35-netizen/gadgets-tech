<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="holoBeam" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="holoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad4)"/>

  <!-- Holographic Beam Cone -->
  <polygon points="175,200 225,200 310,60 90,60" fill="url(#holoBeam)"/>

  <!-- Holographic Floating Object (AI Hologram Wireframe Cube & AI Core) -->
  <!-- Wireframe Iso Cube in mid-air -->
  <g filter="url(#holoGlow)">
    <!-- Top Face -->
    <polygon points="200,65 240,80 200,95 160,80" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Left Face -->
    <polygon points="160,80 200,95 200,140 160,125" fill="#0ea5e9" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Right Face -->
    <polygon points="200,95 240,80 240,125 200,140" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.8"/>
    
    <!-- AI Core Glowing Orb in center of cube -->
    <circle cx="200" cy="110" r="14" fill="#00f2fe" opacity="0.85"/>
    <circle cx="200" cy="110" r="6" fill="#ffffff"/>
  </g>

  <!-- Floating UI rings around hologram -->
  <ellipse cx="200" cy="110" rx="65" ry="24" fill="none" stroke="#67e8f9" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.8"/>
  <ellipse cx="200" cy="110" rx="80" ry="30" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="12 6" opacity="0.6"/>

  <!-- Base Device (Sleek Desktop Cylinder Projector) -->
  <ellipse cx="200" cy="235" rx="80" ry="22" fill="#090d16" stroke="#475569" stroke-width="2"/>
  <path d="M 120 210 L 120 235 C 120 247, 280 247, 280 235 L 280 210 Z" fill="url(#baseGrad)" stroke="#334155" stroke-width="1.5"/>
  <ellipse cx="200" cy="210" rx="80" ry="22" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Projector Aperture Lens -->
  <ellipse cx="200" cy="210" rx="35" ry="10" fill="#00f2fe" filter="url(#holoGlow)"/>

  <text x="200" y="275" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="3">HOLODESK AI • 3D HOLOGRAPHIC ASSISTANT</text>
</svg>