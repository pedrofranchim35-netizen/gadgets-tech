<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="sphereGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="85%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="magBaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="magGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad6)"/>

  <!-- Levitating Sound Waves Emanating outward -->
  <circle cx="200" cy="115" r="70" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.3"/>
  <circle cx="200" cy="115" r="95" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="4 6" opacity="0.2"/>
  <circle cx="200" cy="115" r="120" fill="none" stroke="#818cf8" stroke-width="0.8" stroke-dasharray="8 8" opacity="0.15"/>

  <!-- Magnetic Levitation Flux Field Lines -->
  <path d="M 170 160 C 160 175, 160 195, 170 210" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="3 3" filter="url(#magGlow)"/>
  <path d="M 200 165 C 195 180, 205 195, 200 210" fill="none" stroke="#38bdf8" stroke-width="2.5" filter="url(#magGlow)"/>
  <path d="M 230 160 C 240 175, 240 195, 230 210" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="3 3" filter="url(#magGlow)"/>

  <!-- Levitating Sphere Speaker -->
  <circle cx="200" cy="115" r="48" fill="url(#sphereGrad)" filter="url(#magGlow)"/>
  
  <!-- Speaker Mesh Ring / Accents -->
  <ellipse cx="200" cy="115" rx="46" ry="14" fill="none" stroke="#00f2fe" stroke-width="2" filter="url(#magGlow)"/>
  <ellipse cx="200" cy="115" rx="30" ry="8" fill="#0f172a" stroke="#67e8f9" stroke-width="1.5"/>
  <circle cx="200" cy="115" r="6" fill="#38bdf8"/>

  <!-- Magnetic Base Unit (with induction ring) -->
  <!-- Base 3D cylinder -->
  <ellipse cx="200" cy="235" rx="85" ry="22" fill="#090d16" stroke="#475569" stroke-width="2"/>
  <path d="M 115 210 L 115 235 C 115 248, 285 248, 285 235 L 285 210 Z" fill="url(#magBaseGrad)" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Base top surface -->
  <ellipse cx="200" cy="210" rx="85" ry="22" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  
  <!-- Glowing Magnetic Coil Ring on Base -->
  <ellipse cx="200" cy="210" rx="60" ry="15" fill="none" stroke="#00f2fe" stroke-width="3" filter="url(#magGlow)"/>
  <ellipse cx="200" cy="210" rx="40" ry="10" fill="#0b1329" stroke="#38bdf8" stroke-width="1.5"/>

  <text x="200" y="275" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="3">ORBITAL SOUND • MAG-LEV 360° AUDIO</text>
</svg>