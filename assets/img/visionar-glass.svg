<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Grid background lines -->
  <path d="M 0 50 L 400 50 M 0 100 L 400 100 M 0 150 L 400 150 M 0 200 L 400 200 M 0 250 L 400 250" stroke="#1e293b" stroke-width="1" opacity="0.4"/>
  <path d="M 50 0 L 50 300 M 100 0 L 100 300 M 150 0 L 150 300 M 200 0 L 200 300 M 250 0 L 250 300 M 300 0 L 300 300 M 350 0 L 350 300" stroke="#1e293b" stroke-width="1" opacity="0.4"/>

  <!-- Glowing Aura -->
  <ellipse cx="200" cy="150" rx="120" ry="60" fill="#00f2fe" opacity="0.15" filter="url(#neonGlow)"/>

  <!-- Glasses Frame Back & Temple tips -->
  <path d="M 70 135 Q 110 90 145 125" fill="none" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  <path d="M 330 135 Q 290 90 255 125" fill="none" stroke="#475569" stroke-width="5" stroke-linecap="round"/>

  <!-- Left Lens -->
  <path d="M 85 130 C 85 110, 110 105, 175 110 C 185 112, 190 125, 185 165 C 180 190, 115 195, 90 175 C 80 160, 85 130, 85 130 Z" fill="url(#glassGrad)" stroke="url(#frameGrad)" stroke-width="4" filter="url(#neonGlow)"/>
  
  <!-- Right Lens -->
  <path d="M 315 130 C 315 110, 290 105, 225 110 C 215 112, 210 125, 215 165 C 220 190, 285 195, 310 175 C 320 160, 315 130, 315 130 Z" fill="url(#glassGrad)" stroke="url(#frameGrad)" stroke-width="4" filter="url(#neonGlow)"/>

  <!-- Bridge -->
  <path d="M 175 118 Q 200 110 225 118" fill="none" stroke="url(#frameGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- HUD Interface on Right Lens -->
  <!-- GPS Arrow & Route -->
  <path d="M 245 145 L 255 135 L 265 145 L 257 142 L 257 155 L 253 155 L 253 142 Z" fill="#22c55e" filter="url(#neonGlow)"/>
  <text x="270" y="148" font-family="sans-serif" font-size="10" font-weight="bold" fill="#22c55e">200m RUA TECH</text>
  
  <!-- Translation HUD on Left Lens -->
  <rect x="105" y="132" width="65" height="18" rx="4" fill="#0f172a" opacity="0.7"/>
  <text x="110" y="145" font-family="sans-serif" font-size="9" fill="#38bdf8">EN ➔ PT: Olá!</text>
  <circle cx="100" cy="141" r="3" fill="#38bdf8" filter="url(#neonGlow)"/>

  <!-- Sleek Frame Temples -->
  <path d="M 85 130 C 70 125, 50 145, 40 160" fill="none" stroke="url(#frameGrad)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 315 130 C 330 125, 350 145, 360 160" fill="none" stroke="url(#frameGrad)" stroke-width="5" stroke-linecap="round"/>

  <text x="200" y="270" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="3">VISIONAR GLASS • DUAL AR HUD</text>
</svg>