<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="35%" stop-color="#64748b" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="uvcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="uvcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad5)"/>

  <!-- Glow background -->
  <circle cx="200" cy="140" r="80" fill="#38bdf8" opacity="0.1" filter="url(#uvcGlow)"/>

  <!-- Bottle Cap with UV-C ring & touch display -->
  <rect x="175" y="45" width="50" height="25" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <rect x="172" y="70" width="56" height="8" rx="2" fill="url(#uvcGrad)" filter="url(#uvcGlow)"/>
  
  <!-- Touch screen on cap: Hydration % & Temp -->
  <text x="200" y="61" font-family="sans-serif" font-size="9" font-weight="bold" fill="#38bdf8" text-anchor="middle">24°C • 98%</text>

  <!-- Bottle Neck -->
  <path d="M 180 78 L 180 92 C 180 102, 160 115, 155 130 L 155 225 C 155 240, 245 240, 245 225 L 245 130 C 240 115, 220 102, 220 92 L 220 78 Z" fill="url(#bottleGrad)" stroke="#475569" stroke-width="1.5"/>

  <!-- Water level & UV-C light beam inside bottle body -->
  <path d="M 160 145 C 170 148, 190 142, 200 145 C 210 148, 230 142, 240 145 L 240 220 C 240 232, 160 232, 160 220 Z" fill="#0284c7" fill-opacity="0.3"/>
  
  <!-- UV-C beam through water -->
  <line x1="200" y1="80" x2="200" y2="220" stroke="#a855f7" stroke-width="4" stroke-dasharray="8 4" filter="url(#uvcGlow)"/>

  <!-- Hydration Status LED bar on front -->
  <rect x="198" y="130" width="4" height="65" rx="2" fill="#0f172a"/>
  <rect x="198" y="150" width="4" height="45" rx="2" fill="#22c55e" filter="url(#uvcGlow)"/>

  <!-- Purity / UV-C Shield Icon Badge -->
  <circle cx="280" cy="110" r="22" fill="#0f172a" stroke="#a855f7" stroke-width="2" filter="url(#uvcGlow)"/>
  <text x="280" y="108" font-family="sans-serif" font-size="10" font-weight="bold" fill="#a855f7" text-anchor="middle">UV-C</text>
  <text x="280" y="120" font-family="sans-serif" font-size="7" font-weight="bold" fill="#38bdf8" text-anchor="middle">99.9% PURA</text>

  <text x="200" y="275" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="3">HYDROSMART • UV-C SMART BOTTLE</text>
</svg>